      <rect width="4" height="34" fill="#ff8a1f"/>
      <text x="44" y="22" text-anchor="middle" class="b w" font-size="13">밸런스</text>
    </g>
    <g transform="translate(0,48)">
      <rect width="84" height="34" rx="6" fill="#1b2333" fill-opacity=".78" stroke="#ffffff" stroke-opacity=".18"/>
      <text x="42" y="22" text-anchor="middle" class="b w" font-size="13" fill-opacity=".85">컨택</text>
    </g>
    <g transform="translate(0,88)">
      <rect width="84" height="34" rx="6" fill="#1b2333" fill-opacity=".78" stroke="#ffffff" stroke-opacity=".18"/>
      <text x="42" y="22" text-anchor="middle" class="b w" font-size="13" fill-opacity=".85">파워</text>
    </g>
