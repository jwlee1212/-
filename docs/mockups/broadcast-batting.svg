<svg xmlns="http://www.w3.org/2000/svg" width="844" height="390" viewBox="0 0 844 390">
  <!--
    타석 화면 시안: 실제 야구 중계처럼 (2026-10-15)
    카메라: 중견수 뒤 망원 (투수 등 + 홈플레이트의 타자·포수·심판)
    그래픽: 스코어 버그(왼쪽 위) · 구속(오른쪽 위) · 투구 위치판/노려치기(오른쪽) · 타자 자막(왼쪽 아래)
    조작: 스윙 종류(왼쪽, 왼손 엄지) · 스윙 버튼(오른쪽 아래, 오른손 엄지)
    색은 godot/scripts/ui/tokens.gd 토큰 값 그대로
  -->
  <defs>
    <style>
      text { font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-variant-numeric: tabular-nums; }
      .b { font-weight: 800; }
      .w { fill: #ffffff; }
      .soft { fill: #ffffff; fill-opacity: .72; }
      .ink { stroke: #26324a; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .inks { stroke: #26324a; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    </style>

    <!-- 관중: 먼 줄(작게)과 가까운 줄(크게) -->
    <pattern id="crowdFar" width="11" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="3" r="2" fill="#f4f1ea"/>
      <circle cx="8" cy="2.5" r="2" fill="#ffcf6b"/>
      <circle cx="5.5" cy="7.5" r="2" fill="#7fb2ff"/>
      <circle cx="10.5" cy="7.5" r="2" fill="#ff7a7a"/>
    </pattern>
    <pattern id="crowdNear" width="16" height="13" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#ffcf6b"/>
      <circle cx="12" cy="3.5" r="3" fill="#f4f1ea"/>
      <circle cx="8" cy="10.5" r="3" fill="#9be3b0"/>
      <circle cx="15.5" cy="10.5" r="3" fill="#7fb2ff"/>
      <circle cx="0.5" cy="10.5" r="3" fill="#ff7a7a"/>
    </pattern>
    <!-- 백네트 그물 -->
    <pattern id="net" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 0 L8 8 M8 0 L0 8" stroke="#ffffff" stroke-opacity=".10" stroke-width=".7"/>
    </pattern>

    <linearGradient id="standsShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2333" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1b2333" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".55" r=".75">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".28"/>
    </radialGradient>
    <radialGradient id="moundShade" cx=".5" cy=".2" r=".8">
      <stop offset="0" stop-color="#eab47c"/>
      <stop offset="1" stop-color="#c98d55"/>
    </radialGradient>
    <linearGradient id="capShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screen"><rect width="844" height="390"/></clipPath>
  </defs>

  <g clip-path="url(#screen)">
  <!-- ================= 경기장 ================= -->

  <!-- 홈 뒤 관중석 -->
  <rect width="844" height="114" fill="#4b5d82"/>
  <rect y="0" width="844" height="54" fill="url(#crowdFar)"/>
  <rect y="54" width="844" height="6" fill="#8fa3c7"/>
  <rect y="60" width="844" height="54" fill="url(#crowdNear)"/>
  <rect width="844" height="114" fill="url(#standsShade)"/>
  <rect width="844" height="114" fill="url(#net)"/>

  <!-- 백스톱 벽 + 전광 띠 (가상 문구만) -->
  <rect y="112" width="844" height="34" fill="#1f6b3a"/>
  <rect y="112" width="844" height="3" fill="#ffffff" fill-opacity=".25"/>
  <rect x="0" y="118" width="844" height="20" fill="#0b1220"/>
  <text x="422" y="132.5" text-anchor="middle" class="b" font-size="11" fill="#7cffb2" letter-spacing="3">FIRST PICK  ·  새싹고 화이팅  ·  FIRST PICK  ·  주말리그 전반기  ·  FIRST PICK</text>

  <!-- 홈 뒤 파울 지역 잔디 -->
  <rect y="146" width="844" height="100" fill="#3fae5c"/>

  <!-- 페어 지역 잔디 줄무늬 (멀수록 얇게) -->
  <rect y="238" width="844" height="16" fill="#4cc46a"/>
  <rect y="254" width="844" height="20" fill="#5ed27b"/>
  <rect y="274" width="844" height="25" fill="#4cc46a"/>
  <rect y="299" width="844" height="30" fill="#5ed27b"/>
  <rect y="329" width="844" height="34" fill="#4cc46a"/>
  <rect y="363" width="844" height="30" fill="#5ed27b"/>

  <!-- 홈 둘레 흙 -->
  <ellipse cx="500" cy="216" rx="150" ry="40" fill="#e2a66b"/>
  <ellipse cx="500" cy="222" rx="150" ry="34" fill="#000" fill-opacity=".06"/>

  <!-- 파울 라인 -->
  <path d="M500 226 L-20 318" stroke="#ffffff" stroke-width="2.4" stroke-opacity=".9"/>
  <path d="M500 226 L864 310" stroke="#ffffff" stroke-width="2.4" stroke-opacity=".9"/>
  <!-- 타석 박스 -->
  <path d="M424 210 L482 210 L484 236 L420 236 Z" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-opacity=".85"/>
  <path d="M520 210 L578 210 L582 236 L518 236 Z" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-opacity=".85"/>
  <!-- 홈플레이트 -->
  <path d="M492 222 L510 222 L510 226 L501 229 L492 226 Z" fill="#ffffff" class="inks" stroke-width="1"/>

  <!-- 심판 (포수 뒤) -->
  <g>
    <path d="M490 206 Q490 184 512 182 Q534 184 534 206 Z" fill="#2a2f3a" class="inks"/>
    <circle cx="512" cy="172" r="11" fill="#2a2f3a" class="inks"/>
    <path d="M505 170 h14 M505 174 h14 M512 166 v12" stroke="#8a93a8" stroke-width="1"/>
  </g>

  <!-- 포수 (투수 쪽을 보고 앉음) -->
  <g>
    <!-- 다리·정강이 보호대 -->
    <path d="M484 226 Q482 212 492 208 L500 212 L496 228 Z" fill="#1d3f9e" class="inks"/>
    <path d="M528 226 Q530 212 520 208 L512 212 L516 228 Z" fill="#1d3f9e" class="inks"/>
    <!-- 가슴 보호대 -->
    <path d="M492 192 Q492 186 498 186 L514 186 Q520 186 520 192 L518 214 Q506 218 494 214 Z" fill="#2b3f73" class="inks"/>
    <path d="M500 192 L512 192 M500 199 L512 199 M500 206 L512 206" stroke="#ffffff" stroke-opacity=".25" stroke-width="1.2"/>
