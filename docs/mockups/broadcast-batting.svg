    <text x="50" y="14" class="soft" font-size="10.5">번개고 · 3학년 · 우완</text>
    <text x="203" y="14" text-anchor="end" class="b w" font-size="11">87구</text>
  </g>

  <!-- 채널 표시 + 일시정지 -->
  <text x="760" y="26" text-anchor="end" class="b w" font-size="11" letter-spacing="2.5" fill-opacity=".85">FIRST PICK</text>
  <rect x="765" y="15" width="30" height="14" rx="3" fill="#ff4d5e"/>
  <text x="780" y="25.5" text-anchor="middle" class="b w" font-size="8.5" letter-spacing=".5">LIVE</text>
  <circle cx="818" cy="22" r="13" fill="#1b2333" fill-opacity=".8" stroke="#ffffff" stroke-opacity=".18"/>
  <rect x="813" y="16" width="3.5" height="12" rx="1" fill="#ffffff"/>
  <rect x="819.5" y="16" width="3.5" height="12" rx="1" fill="#ffffff"/>

