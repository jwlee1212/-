    <text x="16" y="19.5" class="b w" font-size="14">번개</text>
    <text x="110" y="20.5" text-anchor="end" class="b w" font-size="17">3</text>
    <!-- 홈 (공격 중: 바탕 밝게 + 주황 표시) -->
    <rect x="0" y="28" width="6" height="28" fill="#2f6bff"/>
    <rect x="6" y="28" width="114" height="28" fill="#ffffff" fill-opacity=".08"/>
    <text x="16" y="47.5" class="b w" font-size="14">새싹</text>
    <path d="M52 38 l6 4 l-6 4 Z" fill="#ff8a1f"/>
    <text x="110" y="48.5" text-anchor="end" class="b w" font-size="17">2</text>
