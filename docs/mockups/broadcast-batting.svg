    <ellipse cx="494" cy="202" rx="4" ry="5" fill="#8b5a2b"/>
  </g>

  <!-- 타자 (내 선수, 우타자라 중계 화면에서는 홈 왼쪽) -->
  <g>
    <ellipse cx="452" cy="231" rx="28" ry="4.5" fill="#000" fill-opacity=".2"/>
    <!-- 다리 -->
    <path d="M438 200 L428 228 L444 228 L452 203 Z" fill="#f4f6fb" class="inks"/>
    <path d="M456 203 L462 228 L478 228 L470 200 Z" fill="#f4f6fb" class="inks"/>
    <path d="M443 213 L438 228 L444 228 Z M465 213 L470 228 L476 228 Z" fill="#dfe4ee"/>
    <ellipse cx="436" cy="229" rx="10" ry="4" fill="#1d3f9e" class="inks"/>
    <ellipse cx="470" cy="229" rx="10" ry="4" fill="#1d3f9e" class="inks"/>
    <!-- 몸통 -->
    <path d="M432 177 Q432 168 443 167 L465 167 Q476 168 476 177 L473 204 L435 204 Z" fill="#ffffff" class="inks"/>
    <path d="M466 170 Q475 172 474 182 L472 204 L463 204 Z" fill="#dfe4ee"/>
    <path d="M454 167 L454 204" stroke="#2f6bff" stroke-width="1.6"/>
    <text x="446" y="186" text-anchor="middle" class="b" font-size="8" fill="#2f6bff">새싹</text>
    <text x="463" y="193" text-anchor="middle" class="b" font-size="9" fill="#2f6bff">7</text>
    <rect x="435" y="200" width="38" height="4.5" fill="#1d3f9e"/>
    <!-- 팔 (손을 뒤 어깨 위로) -->
    <path d="M436 172 Q426 174 432 160 L440 160 Q438 168 442 174 Z" fill="#2f6bff" class="inks"/>
    <path d="M472 173 Q470 166 446 160 L442 166 Q460 170 464 178 Z" fill="#2f6bff" class="inks"/>
    <!-- 배트 -->
    <path d="M438 160 L414 112" stroke="#26324a" stroke-width="8" stroke-linecap="round"/>
    <path d="M438 160 L414 112" stroke="#8b5a2b" stroke-width="5" stroke-linecap="round"/>
    <path d="M430 145 L416 116" stroke="#c48a52" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="438" cy="161" r="5.5" fill="#ffffff" class="inks"/>
    <!-- 머리 -->
    <circle cx="454" cy="150" r="18" fill="#ffd2a6" class="ink"/>
    <ellipse cx="447" cy="155" rx="2" ry="2.6" fill="#26324a"/>
    <ellipse cx="461" cy="155" rx="2" ry="2.6" fill="#26324a"/>
    <ellipse cx="443" cy="160" rx="3" ry="1.6" fill="#ff7a7a" fill-opacity=".45"/>
    <ellipse cx="465" cy="160" rx="3" ry="1.6" fill="#ff7a7a" fill-opacity=".45"/>
    <path d="M451 162 Q454 164 457 162" fill="none" stroke="#26324a" stroke-width="1.4" stroke-linecap="round"/>
    <!-- 헬멧 + 투수 쪽 귀덮개 -->
    <path d="M435 151 Q435 129 454 129 Q473 129 473 151 Q454 143 435 151 Z" fill="#1d3f9e" class="ink"/>
    <path d="M440 148 Q454 141 468 148" fill="none" stroke="#26324a" stroke-width="2"/>
    <path d="M466 147 Q476 146 476 156 Q475 163 468 162 Z" fill="#1d3f9e" class="inks"/>
    <path d="M444 136 Q450 132 458 133" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- 스트라이크존 겹침 (타자 앞, 지난 공 번호) -->
  <g>
    <rect x="484" y="168" width="32" height="38" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-width="1.5" stroke-opacity=".9"/>
    <path d="M494.7 168 V206 M505.3 168 V206 M484 180.7 H516 M484 193.3 H516" stroke="#ffffff" stroke-opacity=".35" stroke-width=".8"/>
    <circle cx="478" cy="203" r="5.5" fill="#34d399" class="inks" stroke-width="1"/>
    <text x="478" y="206" text-anchor="middle" class="b" font-size="7.5" fill="#0b1220">1</text>
    <circle cx="508" cy="184" r="5.5" fill="#fbbf24" class="inks" stroke-width="1"/>
    <text x="508" y="187" text-anchor="middle" class="b" font-size="7.5" fill="#0b1220">2</text>
  </g>

  <!-- 마운드 -->
  <ellipse cx="394" cy="414" rx="240" ry="66" fill="url(#moundShade)"/>
  <ellipse cx="394" cy="414" rx="240" ry="66" fill="none" stroke="#000" stroke-opacity=".08" stroke-width="6"/>

  <!-- 투수 (상대, 등 쪽) — 자막에 가리지 않게 가운데로 -->
  <g transform="translate(34,0)">
    <!-- 다리 -->
    <path d="M318 344 L310 394 L352 394 L358 350 Z" fill="#d9dde6" class="ink"/>
    <path d="M364 350 L370 394 L412 394 L404 344 Z" fill="#d9dde6" class="ink"/>
    <path d="M392 352 L398 394 L410 394 L404 346 Z" fill="#b9c0cf"/>
    <!-- 팔 (세트 자세: 손을 가슴 앞에 모아 팔꿈치가 옆으로) -->
    <path d="M308 280 Q282 288 278 316 Q280 330 296 326 Q300 304 316 294 Z" fill="#ff4d5e" class="ink"/>
    <path d="M412 280 Q438 288 442 316 Q440 330 424 326 Q420 304 404 294 Z" fill="#ff4d5e" class="ink"/>
    <ellipse cx="286" cy="322" rx="11" ry="9" fill="#6b3f1d" class="ink"/>
    <!-- 몸통 (원정 회색 유니폼 등판) -->
    <path d="M300 290 Q300 272 322 270 L398 270 Q420 272 420 290 L414 352 Q360 360 306 352 Z" fill="#eef1f6" class="ink"/>
    <path d="M396 272 Q418 276 418 292 L413 350 Q404 353 394 354 Q402 310 396 272 Z" fill="#cfd6e2"/>
    <path d="M304 290 Q302 274 322 271" fill="none" stroke="#ff4d5e" stroke-width="3"/>
    <path d="M416 290 Q418 274 398 271" fill="none" stroke="#ff4d5e" stroke-width="3"/>
    <text x="360" y="297" text-anchor="middle" class="b" font-size="12" fill="#ff4d5e" letter-spacing="4">하늘</text>
    <text x="360" y="337" text-anchor="middle" class="b" font-size="36" fill="#ff4d5e" stroke="#26324a" stroke-width="2" paint-order="stroke">11</text>
    <rect x="307" y="343" width="107" height="9" fill="#26324a"/>
    <!-- 목·머리 -->
    <rect x="347" y="258" width="26" height="16" fill="#ffd2a6" class="inks"/>
    <circle cx="360" cy="236" r="37" fill="#3a2a22" class="ink"/>
    <ellipse cx="322" cy="242" rx="6.5" ry="10" fill="#ffd2a6" class="ink"/>
    <ellipse cx="398" cy="242" rx="6.5" ry="10" fill="#ffd2a6" class="ink"/>
    <!-- 모자 (뒤쪽, 조절끈 구멍) -->
    <path d="M322 236 Q322 198 360 198 Q398 198 398 236 Q360 228 322 236 Z" fill="#ff4d5e" class="ink"/>
    <path d="M350 233 Q360 222 370 233 Z" fill="#3a2a22"/>
    <path d="M330 222 Q336 206 356 203" fill="none" stroke="url(#capShine)" stroke-width="6" stroke-linecap="round"/>
    <path d="M360 199 V228" stroke="#26324a" stroke-opacity=".35" stroke-width="1.2"/>
    <circle cx="360" cy="199" r="3" fill="#ff4d5e" class="inks" stroke-width="1.2"/>
  </g>

  <!-- 화면 가장자리 어둡게 (그래픽이 잘 읽히게) -->
  <rect width="844" height="390" fill="url(#vignette)"/>

  <!-- ================= 중계 그래픽 ================= -->

  <!-- 스코어 버그 -->
  <g transform="translate(12,12)">
    <rect width="300" height="56" rx="6" fill="#1b2333" fill-opacity=".93" stroke="#ffffff" stroke-opacity=".18"/>
    <!-- 원정 -->
