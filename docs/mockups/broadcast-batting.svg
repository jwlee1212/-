      <path d="M18 0 V66 M36 0 V66 M0 22 H54 M0 44 H54" stroke="#ffffff" stroke-opacity=".3" stroke-width=".8"/>
      <!-- 노리는 칸: 가운데 위 -->
      <rect x="18" y="0" width="18" height="22" fill="#ff8a1f" fill-opacity=".28" stroke="#ff8a1f" stroke-width="2"/>
