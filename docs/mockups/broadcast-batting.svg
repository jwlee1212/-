    <rect x="169" y="23" width="10" height="10" transform="rotate(45 174 28)" fill="#ffffff" fill-opacity=".22"/>
    <rect x="193" y="23" width="10" height="10" transform="rotate(45 198 28)" fill="#ffffff" fill-opacity=".22"/>
    <text x="186" y="50" text-anchor="middle" class="soft" font-size="9.5">1사 2루</text>
    <!-- B S O -->
    <text x="222" y="17" class="b soft" font-size="10.5">B</text>
    <circle cx="240" cy="13" r="4.5" fill="#34d399"/>
    <circle cx="254" cy="13" r="4.5" fill="#34d399"/>
    <circle cx="268" cy="13" r="4.5" fill="#ffffff" fill-opacity=".2"/>
    <text x="222" y="32" class="b soft" font-size="10.5">S</text>
    <circle cx="240" cy="28" r="4.5" fill="#fbbf24"/>
    <circle cx="254" cy="28" r="4.5" fill="#ffffff" fill-opacity=".2"/>
    <text x="222" y="47" class="b soft" font-size="10.5">O</text>
    <circle cx="240" cy="43" r="4.5" fill="#f87171"/>
    <circle cx="254" cy="43" r="4.5" fill="#ffffff" fill-opacity=".2"/>
    <text x="290" y="47" text-anchor="end" class="soft" font-size="9">2-1</text>
  </g>
